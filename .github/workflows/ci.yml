name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and quality gate
    # Apple Silicon, like the testers' Macs. The engine shells out to ffmpeg,
    # and the gate measures real encodes, so this has to be macOS.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: brew install ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -ra

      # CLAUDE.md: the gate must pass after any engine change. It exits
      # non-zero on any failed check.
      - name: Quality gate (video)
        run: python src/verify_quality.py

      - name: Quality gate (image)
        run: |
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=s=1600x1200 -frames:v 1 "$RUNNER_TEMP/photo.jpg"
          python src/verify_quality.py "$RUNNER_TEMP/photo.jpg"

  build:
    name: Build tester DMG
    needs: test
    # Only for release tags and manual runs: a build takes several minutes of
    # macOS runner time and the tests already cover the code.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write      # to publish the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      # Fail before spending build minutes: the tag must match src/version.py
      # and CHANGELOG.md must describe it (it becomes the release notes).
      - name: Check version and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version="$(cd src && python3 -c 'from version import DISPLAY_VERSION; print(DISPLAY_VERSION)')"
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src/version.py ($app_version)"
            exit 1
          fi
          python3 tools/changelog_section.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Install ffmpeg
        run: brew install ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # build.sh bundles the Homebrew ffmpeg with its libraries, verifies the
      # app is self-contained, smoke-launches it and makes the DMG. It refuses
      # a dirty tree, which a fresh checkout never is.
      - name: Build
        run: ./build.sh share

      - uses: actions/upload-artifact@v4
        with:
          name: video-uniqualizer-${{ github.ref_name }}
          path: |
            dist/Video Uniqualizer.dmg
            dist/Video Uniqualizer.dmg.sha256
            dist/RELEASE_NOTES.txt
            dist/TESTING_ON_MAC.md
          if-no-files-found: error

      # Publishes the DMG where Help → Check for Updates looks for it. A tag
      # with a hyphen (v1.0.0-beta.3) becomes a pre-release, which the app
      # offers only to testers already on a pre-release.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo '```'
            cat dist/RELEASE_NOTES.txt
            echo '```'
          } > "$RUNNER_TEMP/release.md"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber \
              "dist/Video Uniqualizer.dmg" "dist/Video Uniqualizer.dmg.sha256"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
              --title "Video Uniqualizer ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release.md" \
              "dist/Video Uniqualizer.dmg" "dist/Video Uniqualizer.dmg.sha256"
          fi
